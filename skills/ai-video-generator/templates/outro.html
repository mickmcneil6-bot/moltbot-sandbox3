<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: linear-gradient(135deg, #1e1b4b 0%, {{BRAND_COLOR}} 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
  }
  .logo-container {
    margin-bottom: 24px;
  }
  .logo-container img {
    max-width: 160px;
    max-height: 80px;
    object-fit: contain;
  }
  .brand-name {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -1px;
    text-align: center;
    margin-bottom: 12px;
    text-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  .tagline {
    font-size: 20px;
    font-weight: 300;
    opacity: 0.8;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  .cta {
    font-size: 24px;
    font-weight: 500;
    opacity: 0.9;
    padding: 16px 48px;
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 50px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
  }
  .accent-line {
    width: 60px;
    height: 3px;
    background: rgba(255,255,255,0.5);
    border-radius: 2px;
    margin: 20px 0;
  }
</style>
</head>
<body>
  <div class="logo-container" id="logo"></div>
  <div class="brand-name">{{BRAND_NAME}}</div>
  <div class="accent-line"></div>
  <div class="tagline" id="tagline">Thanks for watching</div>
  <div class="cta">Subscribe & Follow</div>
  <script>
    const logoUrl = '{{BRAND_LOGO}}';
    const tagline = '{{TAGLINE}}';
    if (logoUrl) {
      document.getElementById('logo').innerHTML = '<img src="' + logoUrl + '" alt="Logo">';
    }
    if (tagline) {
      document.getElementById('tagline').textContent = tagline;
    }
  </script>
</body>
</html>
