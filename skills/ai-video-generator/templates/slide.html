<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: #0f0f1a;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 40px;
    background: rgba(255,255,255,0.05);
    border-bottom: 2px solid {{BRAND_COLOR}};
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-brand img {
    width: 36px;
    height: 36px;
    object-fit: contain;
  }
  .header-brand-name {
    font-size: 18px;
    font-weight: 600;
    opacity: 0.9;
  }
  .scene-counter {
    font-size: 14px;
    opacity: 0.5;
    font-weight: 500;
    letter-spacing: 1px;
  }
  .content-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 80px;
  }
  .content-text {
    font-size: 42px;
    font-weight: 600;
    line-height: 1.4;
    text-align: center;
    max-width: 900px;
    background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.8) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .bottom-accent {
    height: 6px;
    background: linear-gradient(90deg, {{BRAND_COLOR}}, transparent);
  }
</style>
</head>
<body>
  <div class="header">
    <div class="header-brand">
      <span class="header-brand-name" id="brand-name"></span>
    </div>
    <div class="scene-counter" id="counter"></div>
  </div>
  <div class="content-area">
    <div class="content-text">{{CONTENT}}</div>
  </div>
  <div class="bottom-accent"></div>
  <script>
    const brandName = '{{BRAND_NAME}}';
    const logoUrl = '{{BRAND_LOGO}}';
    const sceneNum = '{{SCENE_NUMBER}}';
    const totalScenes = '{{TOTAL_SCENES}}';

    const brandEl = document.getElementById('brand-name');
    if (logoUrl) {
      brandEl.innerHTML = '<img src="' + logoUrl + '" style="width:36px;height:36px;object-fit:contain;vertical-align:middle;margin-right:8px">' + brandName;
    } else {
      brandEl.textContent = brandName;
    }

    if (sceneNum && totalScenes) {
      document.getElementById('counter').textContent = sceneNum + ' / ' + totalScenes;
    }
  </script>
</body>
</html>
